# Render Blueprint — deploy coolmathgames2.0 from the GitHub repo.
#
# One-time setup on Render:
#   Dashboard → New → Blueprint → connect the GitHub repo → pick this file.
# Render then builds on every push to the connected branch.
#
# Persistence note: with no DATABASE_URL set, the app uses on-disk SQLite. On a
# free instance that filesystem is EPHEMERAL — generated instances are lost on
# redeploy or spin-down (fine for a demo). For durable data, either:
#   (a) attach the disk block below (requires a paid instance), or
#   (b) set DATABASE_URL to a Supabase Session-pooler URI (see .env.example) and
#       set DB_SCHEMA — the app swaps to Postgres with no code change.

services:
  - type: web
    name: coolmathgames2
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Postgres schema namespace — only used if DATABASE_URL is set below.
      - key: DB_SCHEMA
        value: coolmathgames
      # Where the default SQLite file lives (used only when DATABASE_URL is unset).
      - key: SQLITE_PATH
        value: coolmathgames.db
      # Supabase connection — the SECRET. `sync: false` means "declared here but
      # valued in the Render dashboard", so it stays out of git and isn't pruned
      # on Blueprint sync. Use the Supabase SESSION pooler URI on :5432 (NOT the
      # transaction pooler :6543, which drops search_path and breaks isolation).
      - key: DATABASE_URL
        sync: false

    # --- Durable SQLite via a disk (uncomment; requires a paid instance) ---
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # Then set SQLITE_PATH=/var/data/coolmathgames.db above.
