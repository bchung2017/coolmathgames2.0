   <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #57606a" transform="translate(15.12 326.497706)">citation in the automatic item generation literature). Right: measured in Cui et al., "Promises and Pitfalls" (IEEE TVCG</text>
   <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #57606a" transform="translate(15.12 335.232)">2025) — ≈$0.05 GPT-4 API + $0.23 expert review ($20/hr × 16 hrs over 1,103 items); throughput 8.4 vs 34 items/hr.</text>
